{% extends "base.html" %}
{% block title %}New Maintenance Request{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">New Maintenance Request</h1>
    <p class="page-subtitle">Report an issue or schedule a service</p>
  </div>
  <a href="{{ url_for('maintenance.list_logs') }}" class="btn btn-outline-primary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Back
  </a>
</div>

<div style="max-width:680px">
  <div class="card">
    <div class="card-header-custom">
      <h3 class="card-title"><i class="bi bi-tools me-2" style="color:var(--brass)"></i>Request Details</h3>
    </div>
    <div class="card-body-custom">
      <form method="POST" action="{{ url_for('maintenance.create') }}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">

          <div style="grid-column:1/-1">
            <label class="form-label-custom" for="asset_id">Asset *</label>
            <select id="asset_id" name="asset_id" class="form-control-custom" required>
              <option value="">Select an asset</option>
              {% for a in assets %}
              <option value="{{ a.id }}" {{ 'selected' if selected_asset and selected_asset.id == a.id }}>
                {{ a.asset_tag }} — {{ a.name }} ({{ a.department.name if a.department else 'N/A' }})
              </option>
              {% endfor %}
            </select>
          </div>

          <div>
            <label class="form-label-custom" for="priority">Priority</label>
            <select id="priority" name="priority" class="form-control-custom">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </div>

          <div>
            <label class="form-label-custom" for="scheduled_date">Preferred Service Date</label>
            <input type="date" id="scheduled_date" name="scheduled_date" class="form-control-custom" />
          </div>

          <div>
            <label class="form-label-custom" for="estimated_cost">Estimated Cost (₹)</label>
            <input type="number" id="estimated_cost" name="estimated_cost" class="form-control-custom"
              step="0.01" min="0" placeholder="0.00" />
          </div>

          <div style="grid-column:1/-1">
            <label class="form-label-custom" for="issue_description">Issue Description *</label>
            <textarea id="issue_description" name="issue_description" class="form-control-custom" rows="4" required
              placeholder="Describe the problem, symptoms, or service needed in detail…"></textarea>
          </div>

        </div>

        <div style="margin-top:20px">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-send me-2"></i>Submit Request
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
