<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2723" />
      <stop offset="100%" stop-color="#051210" />
    </linearGradient>
  </defs>

  <rect x="4" y="5" width="50" height="50" rx="14" fill="url(#badgeBg)" stroke="url(#pulseGrad)" stroke-width="1.5" />
  
  <polyline points="12,30 20,30 24,18 28,42 32,14 36,38 40,24 44,30 48,30"
